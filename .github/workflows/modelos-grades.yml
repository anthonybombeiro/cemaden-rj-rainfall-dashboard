name: Grades dos modelos numéricos

# Gera, em paralelo, as grades recortadas de cada modelo aberto (GFS, IFS 0,25°, IFS 0,1°, AIFS e, depois, conjuntos e ICON) e publica
# tudo no branch `dados-modelos` (um único commit, sobrescrito). O painel lê direto de raw.githubusercontent.com.
# Documentação: docs/modelos-numericos.md. Dados abertos: NOAA (domínio público), ECMWF (CC-BY-4.0, citar a fonte), DWD (atribuição).

on:
  schedule:
    - cron: "40 */3 * * *"
  workflow_dispatch:
    inputs:
      forcar:
        description: "Regerar mesmo que a rodada já esteja publicada"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: dados-modelos
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        modelo: [gfs, ifs, aifs, ifs01, ifsens, gefs]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/modelos/requirements.txt

      - run: pip install -r scripts/modelos/requirements.txt

      - name: Ver a rodada já publicada
        env:
          MODELO: ${{ matrix.modelo }}
          FORCAR: ${{ inputs.forcar }}
        run: |
          mkdir -p pub/$MODELO
          if [ "$FORCAR" != "true" ]; then
            curl -sf "https://raw.githubusercontent.com/${{ github.repository }}/dados-modelos/$MODELO/meta.json" -o pub/$MODELO/meta.json || rm -f pub/$MODELO/meta.json
          fi

      - name: Gerar grades
        env:
          MODELO: ${{ matrix.modelo }}
        run: python scripts/modelos/gerar_grades.py --modelo "$MODELO" --saida saida --so-se-nova pub

      - uses: actions/upload-artifact@v4
        with:
          name: dados-${{ matrix.modelo }}
          path: saida/${{ matrix.modelo }}
          if-no-files-found: ignore
          retention-days: 1

  publicar:
    needs: gerar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dados-*
          path: novos

      - name: Publicar no branch dados-modelos
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          if [ -z "$(ls -A novos 2>/dev/null)" ]; then echo "Nenhuma rodada nova; nada a publicar."; exit 0; fi
          if git ls-remote --exit-code --heads "$REPO_URL" dados-modelos >/dev/null 2>&1; then
            git clone -q --depth 1 --branch dados-modelos "$REPO_URL" dados
          else
            mkdir dados
          fi
          rm -rf dados/.git
          shopt -s nullglob
          for d in novos/dados-*; do
            m="${d#novos/dados-}"
            rm -rf "dados/$m"
            mkdir -p "dados/$m"
            cp -r "$d"/. "dados/$m"/
          done
          cd dados
          printf 'Dados gerados automaticamente (scripts/modelos/gerar_grades.py) para o Painel CEMADEN-RJ. Nao edite.\nGFS e GEFS: NOAA/NCEP (dominio publico). IFS, AIFS e ENS: ECMWF Open Data (CC-BY-4.0). ICON: DWD.\n' > README.md
          git init -q -b dados-modelos
          git config user.name "CEMADEN-RJ bot"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git commit -q -m "Grades dos modelos $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "$REPO_URL" dados-modelos
